# Commit coordinated source metadata only. Run Build separately on the branch.
name: Bump version

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Semantic version bump
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: checkout selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: bump, validate and push source only
        env:
          MODE: ${{ inputs.mode }}
          SELECTED_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != branch ]; then
            echo "::error::Select a branch, not a tag"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/lifecycle.py bump-push "$MODE" "$SELECTED_BRANCH" "$GITHUB_SHA"

      - name: summary
        run: |
          echo "### Source version bumped; no tag or release created. Run Build manually on the updated branch when ready." >> "$GITHUB_STEP_SUMMARY"
