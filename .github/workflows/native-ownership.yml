name: Native ownership

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  ownership:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Actual sources and unchanged SDK, ASan and UBSan
        run: python3 tests/native/run.py --baseline
      - name: Existing lifecycle preservation tests
        run: python3 -m unittest discover -s .github/tests -v
